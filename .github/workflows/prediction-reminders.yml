name: Prediction Reminder Notifications

on:
  schedule:
    # Keep reminders on their existing cadence.
    - cron: '0 */6 * * *'
    # Check closures promptly without repeating reminders.
    - cron: '*/10 * * * *'
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: prediction-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send Prediction Reminders
        env:
          F1_LEAGUE_API_URL: ${{ secrets.F1_LEAGUE_API_URL || 'https://f1-league.hades.ws' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Sending prediction reminder notifications..."
          echo "API URL: ${F1_LEAGUE_API_URL}"

          API_URL="${F1_LEAGUE_API_URL}/api/notifications/predictions"
          if [ "${SCHEDULE}" = '*/10 * * * *' ]; then
            API_URL="${API_URL}?closure-only=1"
          fi
          
          # Call the prediction reminder endpoint
          RESPONSE=$(curl -s -X POST "${API_URL}" \
            -H "Content-Type: application/json")
          
          echo "Response: ${RESPONSE}"
          
          # Extract status for logging
          STATUS=$(echo "${RESPONSE}" | grep -o '"status":"[^"]*"' | head -1)
          echo "Status: ${STATUS}"
