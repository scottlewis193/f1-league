<!doctype html>
<html lang="en" style="view-transition-name: theme">
	<head>
		<meta id="theme-color" name="theme-color" content="" />
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, viewport-fit=cover"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			//ensure theme is loaded before page to avoid flash
			let theme = localStorage.getItem('theme');
			if (!theme) theme = 'dark';
			document.documentElement.setAttribute('data-theme', theme);
		</script>
		<script type="module">
			requestAnimationFrame(() => {
				const barColor = window.getComputedStyle(document.body).getPropertyValue('--color-base-300').trim();
				const meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.content = barColor;
			});
		</script>
	</body>
</html>
